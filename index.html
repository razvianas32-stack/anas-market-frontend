<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anas Market</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>


  <header class="navbar">
    
  <div class="logo">Anas Market</div>
  <input type="text" id="search" placeholder="Search for products...">
  
  <input type="email" id="login-email" placeholder="Email">
<input type="password" id="login-password" placeholder="Password">
<button onclick="login()">Login</button>

 
 </header>
<section class="banner">
  <h1>Welcome to Anas Market</h1>
  <p>Best Deals, Best Prices 🔥</p>
</section>

<section class="products" id="product-list"></section>

 <!-- 🛒 Cart Button -->
<button id="cart-btn">Cart 🛒 (<span id="cart-count">0</span>)</button>

<!-- 🛒 Cart Box -->
<div id="cart-box" class="cart-box">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button id="close-cart">✖</button>
  </div>

  <ul id="cart-items"></ul>

  <div class="cart-footer">
    <h3>Total: ₹<span id="total-price">0</span></h3>
  </div>
</div>

<!-- 🔐 Login Box -->
<div id="login-box" class="login-box">
  <div class="login-content">
    <span class="close" onclick="closeLogin()">×</span>
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Login</button>
  </div>
</div>


<script>
const token = localStorage.getItem("token");

if (!token) {
  alert("Please login first ❌");
  window.location.href = "login.html";
}
function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

</script>
<script> src="signup.js"></script>
<script src="script.js"></script>
</body>
</html>
